services:
  app:
    build:
      context: .
      # 构建期代理：从宿主机环境读取，所以下面这种写法才能生效：
      #   HTTP_PROXY=http://192.168.31.158:7890 HTTPS_PROXY=http://192.168.31.158:7890 \
      #     docker compose up -d --build
      # 需要走代理的机器填上，不需要的留空即可（留空 = 直连）。
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    image: 101rtnotice:1.0.0
    container_name: 101rtnotice
    restart: unless-stopped
    init: true
    ports:
      - "8686:8686"
    environment:
      # 服务器时间时区：影响存活期销毁、房间回收（24h 无 A 端轮询）
      TZ: Asia/Shanghai
      PORT: "8686"
      DATA_DIR: /data
    volumes:
      # 命名卷：房间与消息落盘在此，容器重启 / 重建均不丢失
      - rtn-data:/data
      # 如需改成宿主目录便于备份，改用下面这行，并先执行：
      #   mkdir -p ./data && sudo chown -R 1000:1000 ./data
      # - ./data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||8686)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  rtn-data:
