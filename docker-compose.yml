services:
  app:
    build:
      context: .
      # 构建期代理：从宿主机环境读取，所以下面这种写法才能生效：
      #   HTTP_PROXY=http://192.168.31.158:7890 HTTPS_PROXY=http://192.168.31.158:7890 \
      #     docker compose up -d --build
      # 需要走代理的机器填上，不需要的留空即可（留空 = 直连）。
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    image: 101rtnotice:1.0.0
    container_name: 101rtnotice
    restart: unless-stopped
    init: true
    ports:
      - "8686:8686"
    environment:
      # 服务器时间时区：影响存活期销毁、房间回收（24h 无 A 端轮询）
      TZ: Asia/Shanghai
      PORT: "8686"
      # 数据目录：/data 下只占一个子目录，方便 /data 同时挂载给其它应用
      DATA_DIR: /data/101rtnotice
    volumes:
      # 直接映射到宿主机目录：备份只需 rsync / 打快照，不用进容器捞。
      # 首次使用需先建目录并给权限（容器内以 uid 1000 的 node 用户运行）：
      #   sudo mkdir -p /data/101rtnotice
      #   sudo chown -R 1000:1000 /data/101rtnotice
      - /data/101rtnotice:/data/101rtnotice
      # 不想用宿主目录的话，注释上面一行、启用下面一行（命名卷，不用管权限）：
      # - rtn-data:/data/101rtnotice
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||8686)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  # 备选方案用：把上面的绑定目录换成 rtn-data:/data/101rtnotice 时才需要
  rtn-data:
